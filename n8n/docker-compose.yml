services:
  n8n:
    image: n8nio/n8n:1.123.94
    container_name: lendloop-n8n
    restart: unless-stopped

    ports:
      - "127.0.0.1:5678:5678"

    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=https://doing-iron-carey-comments.trycloudflare.com/
      - N8N_EDITOR_BASE_URL=https://doing-iron-carey-comments.trycloudflare.com/
      - N8N_PROXY_HOPS=1
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
      - N8N_SECURE_COOKIE=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in n8n/.env}
      - LENDLOOP_HMAC_SECRET=${LENDLOOP_HMAC_SECRET:?Set LENDLOOP_HMAC_SECRET in n8n/.env}
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false

    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
